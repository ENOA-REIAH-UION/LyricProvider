name: Android Multi-App Build & Release

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build Type'
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build and Release Apps
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ github.event.inputs.build-type || 'release' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build APKs
        run: |
          BUILD_TASK=assembleDebug
          if [ "$BUILD_TYPE" = "release" ]; then
            BUILD_TASK=assembleRelease
          fi

          # Maven Central 偶发不可达会让构建脚本的 classpath 解析直接失败（报某个构件
          # Could not find），与项目配置无关。失败时刷新依赖元数据再重试一次。
          ./gradlew "$BUILD_TASK" --build-cache \
            || ./gradlew "$BUILD_TASK" --build-cache --refresh-dependencies

      - name: Collect APKs to flat directory
        run: |
          mkdir -p collected-apks

          find . -name "*.apk" -path "*/build/outputs/apk/${BUILD_TYPE}/*" -exec cp {} collected-apks/ \;

          echo "Collected files:"
          ls -lh collected-apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_TYPE }}-apks
          path: collected-apks/
          if-no-files-found: error
          archive: false
